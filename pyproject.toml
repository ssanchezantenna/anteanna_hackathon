[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "first-watch"
version = "0.1.0"
description = "Predict the first title a new streaming subscriber will watch"
requires-python = ">=3.10"
dependencies = [
    "lightgbm>=4.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "google-cloud-bigquery>=3.10",
    "db-dtypes>=1.1",
    "joblib>=1.3",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "dbt-bigquery>=1.7",
]

[project.scripts]
first-watch = "cli.main:cli"

[tool.setuptools.packages.find]
include = ["first_watch_model*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
